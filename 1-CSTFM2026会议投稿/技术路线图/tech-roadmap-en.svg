<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1520" font-family="'Times New Roman', Georgia, serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#37474F"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565C0"/>
    </marker>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/><stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/><stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/><stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE4EC"/><stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE7F6"/><stop offset="100%" stop-color="#D1C4E9"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A237E">Technical Roadmap for Urban Chemical Accident</text>
  <text x="550" y="60" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A237E">Emergency Evacuation Optimization</text>
  <text x="550" y="80" text-anchor="middle" font-size="12" fill="#546E7A">— A Case Study of the Taiping Bridge Incident on Beijing's 6th Ring Road, Yizhuang —</text>
  <line x1="200" y1="90" x2="900" y2="90" stroke="#90CAF9" stroke-width="1.5"/>

  <!-- ==================== PHASE 1 ==================== -->
  <rect x="30" y="105" width="1040" height="335" rx="8" fill="url(#p1)" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="30" y="105" width="1040" height="32" rx="8" fill="#1565C0"/>
  <text x="550" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Phase I: Study Area Delineation &amp; Multi-Source Data Preprocessing</text>

  <!-- Step 0 -->
  <rect x="380" y="152" width="340" height="50" rx="5" fill="white" stroke="#1565C0" stroke-width="1.2"/>
  <text x="550" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Study Area Delineation (Step 0)</text>
  <text x="550" y="190" text-anchor="middle" font-size="10" fill="#37474F">Yizhuang Boundary → 15 km Buffer → Incident Point</text>

  <line x1="550" y1="202" x2="550" y2="222" stroke="#37474F" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="50" y="228" width="220" height="72" rx="5" fill="white" stroke="#1565C0" stroke-width="1.2"/>
  <text x="160" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">Road Network (Step 2)</text>
  <text x="160" y="264" text-anchor="middle" font-size="9.5" fill="#37474F">• OSM clipping &amp; classification</text>
  <text x="160" y="277" text-anchor="middle" font-size="9.5" fill="#37474F">• Speed limit / capacity assignment</text>
  <text x="160" y="290" text-anchor="middle" font-size="9.5" fill="#37474F">• NetworkX directed graph</text>

  <!-- Step 3 -->
  <rect x="290" y="228" width="220" height="72" rx="5" fill="white" stroke="#1565C0" stroke-width="1.2"/>
  <text x="400" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">POI Facilities (Step 3)</text>
  <text x="400" y="264" text-anchor="middle" font-size="9.5" fill="#37474F">• Hospitals / Fire stations</text>
  <text x="400" y="277" text-anchor="middle" font-size="9.5" fill="#37474F">• Emergency shelters</text>
  <text x="400" y="290" text-anchor="middle" font-size="9.5" fill="#37474F">• Metro stations</text>

  <!-- Step 4 -->
  <rect x="530" y="228" width="220" height="72" rx="5" fill="white" stroke="#1565C0" stroke-width="1.2"/>
  <text x="640" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">Population (Step 4)</text>
  <text x="640" y="264" text-anchor="middle" font-size="9.5" fill="#37474F">• Block-level population clipping</text>
  <text x="640" y="277" text-anchor="middle" font-size="9.5" fill="#37474F">• Census age-structure matching</text>
  <text x="640" y="290" text-anchor="middle" font-size="9.5" fill="#37474F">• Vulnerable group identification</text>

  <!-- Step 5 -->
  <rect x="770" y="228" width="220" height="72" rx="5" fill="white" stroke="#1565C0" stroke-width="1.2"/>
  <text x="880" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">OD &amp; Commuting (Step 5)</text>
  <text x="880" y="264" text-anchor="middle" font-size="9.5" fill="#37474F">• BD-09 → WGS84 conversion</text>
  <text x="880" y="277" text-anchor="middle" font-size="9.5" fill="#37474F">• Coarse + fine spatial filtering</text>
  <text x="880" y="290" text-anchor="middle" font-size="9.5" fill="#37474F">• Spatio-temporal trip patterns</text>

  <!-- Dashed connections -->
  <line x1="270" y1="264" x2="290" y2="264" stroke="#90A4AE" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="510" y1="264" x2="530" y2="264" stroke="#90A4AE" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="750" y1="264" x2="770" y2="264" stroke="#90A4AE" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Data sources -->
  <rect x="60" y="316" width="180" height="22" rx="3" fill="#E8EAF6" stroke="#7986CB" stroke-width="0.8"/>
  <text x="150" y="331" text-anchor="middle" font-size="9" fill="#3949AB">Source: OSM Shapefile</text>
  <rect x="310" y="316" width="180" height="22" rx="3" fill="#E8EAF6" stroke="#7986CB" stroke-width="0.8"/>
  <text x="400" y="331" text-anchor="middle" font-size="9" fill="#3949AB">Source: POI 2022.06</text>
  <rect x="550" y="316" width="180" height="22" rx="3" fill="#E8EAF6" stroke="#7986CB" stroke-width="0.8"/>
  <text x="640" y="331" text-anchor="middle" font-size="9" fill="#3949AB">Source: Census + Block Pop.</text>
  <rect x="790" y="316" width="180" height="22" rx="3" fill="#E8EAF6" stroke="#7986CB" stroke-width="0.8"/>
  <text x="880" y="331" text-anchor="middle" font-size="9" fill="#3949AB">Source: Baidu Migration OD</text>

  <!-- Key methods -->
  <rect x="60" y="350" width="990" height="26" rx="3" fill="#E3F2FD" stroke="#90CAF9" stroke-width="0.8"/>
  <text x="550" y="368" text-anchor="middle" font-size="10" fill="#1565C0" font-style="italic">Methods: GIS Spatial Clipping | Coordinate Transformation (BD-09→GCJ-02→WGS84) | Spatial Join | Census Disaggregation</text>

  <!-- Merge arrows -->
  <line x1="160" y1="395" x2="160" y2="445" stroke="#37474F" stroke-width="1.2"/>
  <line x1="400" y1="395" x2="400" y2="445" stroke="#37474F" stroke-width="1.2"/>
  <line x1="640" y1="395" x2="640" y2="445" stroke="#37474F" stroke-width="1.2"/>
  <line x1="880" y1="395" x2="880" y2="445" stroke="#37474F" stroke-width="1.2"/>
  <line x1="160" y1="445" x2="880" y2="445" stroke="#37474F" stroke-width="1.2"/>
  <line x1="550" y1="445" x2="550" y2="465" stroke="#37474F" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ==================== PHASE 2 ==================== -->
  <rect x="30" y="470" width="1040" height="245" rx="8" fill="url(#p2)" stroke="#2E7D32" stroke-width="1.5"/>
  <rect x="30" y="470" width="1040" height="32" rx="8" fill="#2E7D32"/>
  <text x="550" y="492" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Phase II: Multimodal Transportation Network &amp; Travel Time Estimation</text>

  <!-- Step 6 -->
  <rect x="60" y="516" width="300" height="78" rx="5" fill="white" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="210" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Travel Time Matrix (Step 6)</text>
  <text x="210" y="553" text-anchor="middle" font-size="9.5" fill="#37474F">• Dijkstra shortest path algorithm</text>
  <text x="210" y="567" text-anchor="middle" font-size="9.5" fill="#37474F">• Free-flow travel time matrix</text>
  <text x="210" y="581" text-anchor="middle" font-size="9.5" fill="#37474F">• Incident: BPR congestion + road closure</text>

  <!-- Step 7 -->
  <rect x="400" y="516" width="300" height="78" rx="5" fill="white" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="550" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Metro Network (Step 7)</text>
  <text x="550" y="553" text-anchor="middle" font-size="9.5" fill="#37474F">• POI matching + knowledge-based topology</text>
  <text x="550" y="567" text-anchor="middle" font-size="9.5" fill="#37474F">• Yizhuang / Daxing / Line 5 &amp; 10</text>
  <text x="550" y="581" text-anchor="middle" font-size="9.5" fill="#37474F">• Inter-station &amp; transfer time assignment</text>

  <!-- Router -->
  <rect x="740" y="516" width="300" height="78" rx="5" fill="white" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="890" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Network Router Engine</text>
  <text x="890" y="553" text-anchor="middle" font-size="9.5" fill="#37474F">• KDTree spatial indexing</text>
  <text x="890" y="567" text-anchor="middle" font-size="9.5" fill="#37474F">• Travel time caching</text>
  <text x="890" y="581" text-anchor="middle" font-size="9.5" fill="#37474F">• Dual-mode: free-flow / incident</text>

  <!-- Step 8 -->
  <rect x="250" y="612" width="600" height="50" rx="5" fill="white" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="550" y="632" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Multi-Source Data Integration (Step 8)</text>
  <text x="550" y="648" text-anchor="middle" font-size="10" fill="#37474F">Road + Metro + Facilities + Population + OD → Unified Spatial Database</text>

  <line x1="210" y1="594" x2="210" y2="606" stroke="#37474F" stroke-width="1"/>
  <line x1="550" y1="594" x2="550" y2="612" stroke="#37474F" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="890" y1="594" x2="890" y2="606" stroke="#37474F" stroke-width="1"/>
  <line x1="210" y1="606" x2="890" y2="606" stroke="#37474F" stroke-width="1"/>

  <rect x="60" y="674" width="990" height="26" rx="3" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="0.8"/>
  <text x="550" y="692" text-anchor="middle" font-size="10" fill="#2E7D32" font-style="italic">Methods: Dijkstra Algorithm | BPR Function t=t₀[1+α(v/c)^β] | KDTree Nearest Neighbor | Multimodal Network Fusion</text>

  <line x1="550" y1="715" x2="550" y2="742" stroke="#37474F" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== PHASE 3 ==================== -->
  <rect x="30" y="747" width="1040" height="155" rx="8" fill="url(#p3)" stroke="#E65100" stroke-width="1.5"/>
  <rect x="30" y="747" width="1040" height="32" rx="8" fill="#E65100"/>
  <text x="550" y="769" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Phase III: Incident Scenario Simulation &amp; Demand Estimation</text>

  <!-- Step 9 -->
  <rect x="60" y="794" width="460" height="78" rx="5" fill="white" stroke="#E65100" stroke-width="1.2"/>
  <text x="290" y="814" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">Incident Scenario Construction (Step 9)</text>
  <text x="290" y="831" text-anchor="middle" font-size="9.5" fill="#37474F">• Hazmat spill scenario on 6th Ring Road</text>
  <text x="290" y="845" text-anchor="middle" font-size="9.5" fill="#37474F">• 1 km closure zone + 3 km congestion zone</text>
  <text x="290" y="859" text-anchor="middle" font-size="9.5" fill="#37474F">• Road closure + BPR congestion overlay</text>

  <rect x="560" y="794" width="460" height="78" rx="5" fill="white" stroke="#E65100" stroke-width="1.2"/>
  <text x="790" y="814" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">Evacuation Demand Estimation</text>
  <text x="790" y="831" text-anchor="middle" font-size="9.5" fill="#37474F">• Three-tier classification: critical(ω₁=10) / vulnerable(ω₂=5) / general(ω₃=1)</text>
  <text x="790" y="845" text-anchor="middle" font-size="9.5" fill="#37474F">• Spatialized demand from population + age structure</text>
  <text x="790" y="859" text-anchor="middle" font-size="9.5" fill="#37474F">• OD-constrained trip patterns</text>

  <rect x="60" y="882" width="990" height="26" rx="3" fill="#FFF3E0" stroke="#FFCC80" stroke-width="0.8"/>
  <text x="550" y="900" text-anchor="middle" font-size="10" fill="#E65100" font-style="italic">Methods: Scenario Analysis | Weighted Population Classification Model | Time-Varying Evacuation Demand</text>

  <line x1="550" y1="918" x2="550" y2="945" stroke="#37474F" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== PHASE 4 ==================== -->
  <rect x="30" y="950" width="1040" height="228" rx="8" fill="url(#p4)" stroke="#C62828" stroke-width="1.5"/>
  <rect x="30" y="950" width="1040" height="32" rx="8" fill="#C62828"/>
  <text x="550" y="972" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Phase IV: Emergency Resource Optimization &amp; Evacuation Routing</text>

  <!-- Step 10 -->
  <rect x="60" y="997" width="460" height="92" rx="5" fill="white" stroke="#C62828" stroke-width="1.2"/>
  <text x="290" y="1017" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">Resource Supply Optimization (Step 10)</text>
  <text x="290" y="1034" text-anchor="middle" font-size="9.5" fill="#37474F">• Objective: Minimize weighted total response time</text>
  <text x="290" y="1048" text-anchor="middle" font-size="9.5" fill="#37474F">• Constraints: facility capacity, service radius, budget</text>
  <text x="290" y="1062" text-anchor="middle" font-size="9.5" fill="#37474F">• Solver: Mixed-Integer Linear Programming (MILP)</text>
  <text x="290" y="1076" text-anchor="middle" font-size="9.5" fill="#37474F">• Sensitivity analysis on resource allocation</text>

  <!-- Step 11 -->
  <rect x="560" y="997" width="460" height="92" rx="5" fill="white" stroke="#C62828" stroke-width="1.2"/>
  <text x="790" y="1017" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">Multi-Objective Evacuation Routing (Step 11)</text>
  <text x="790" y="1034" text-anchor="middle" font-size="9.5" fill="#37474F">• Obj. 1: Minimize total evacuation time</text>
  <text x="790" y="1048" text-anchor="middle" font-size="9.5" fill="#37474F">• Obj. 2: Maximize vulnerable group priority</text>
  <text x="790" y="1062" text-anchor="middle" font-size="9.5" fill="#37474F">• Constraints: road capacity, shelter capacity, equity</text>
  <text x="790" y="1076" text-anchor="middle" font-size="9.5" fill="#37474F">• Solver: Multi-objective optimization + Pareto frontier</text>

  <line x1="520" y1="1043" x2="560" y2="1043" stroke="#C62828" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="540" y="1035" text-anchor="middle" font-size="8" fill="#C62828">coupled</text>

  <!-- Objective -->
  <rect x="150" y="1105" width="800" height="40" rx="5" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1"/>
  <text x="550" y="1121" text-anchor="middle" font-size="11" fill="#E65100" font-weight="bold">Core Objective Function</text>
  <text x="550" y="1137" text-anchor="middle" font-size="10" fill="#37474F">min Z = Σₖ Σᵢ Σⱼ ωₖ · dₖᵢ · tᵢⱼ · xₖᵢⱼ     (Weighted Evacuation Time Minimization)</text>

  <rect x="60" y="1155" width="990" height="26" rx="3" fill="#FCE4EC" stroke="#F48FB1" stroke-width="0.8"/>
  <text x="550" y="1173" text-anchor="middle" font-size="10" fill="#C62828" font-style="italic">Methods: MILP | Multi-Objective Optimization | Pareto Frontier | Sensitivity Analysis</text>

  <line x1="550" y1="1192" x2="550" y2="1218" stroke="#37474F" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== PHASE 5 ==================== -->
  <rect x="30" y="1223" width="1040" height="160" rx="8" fill="url(#p5)" stroke="#4527A0" stroke-width="1.5"/>
  <rect x="30" y="1223" width="1040" height="32" rx="8" fill="#4527A0"/>
  <text x="550" y="1245" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Phase V: Result Analysis &amp; Policy Recommendations</text>

  <rect x="60" y="1270" width="300" height="62" rx="5" fill="white" stroke="#4527A0" stroke-width="1.2"/>
  <text x="210" y="1290" text-anchor="middle" font-size="11" font-weight="bold" fill="#4527A0">Visualization &amp; Spatial Analysis</text>
  <text x="210" y="1306" text-anchor="middle" font-size="9.5" fill="#37474F">• Evacuation route mapping</text>
  <text x="210" y="1320" text-anchor="middle" font-size="9.5" fill="#37474F">• Facility coverage assessment</text>

  <rect x="400" y="1270" width="300" height="62" rx="5" fill="white" stroke="#4527A0" stroke-width="1.2"/>
  <text x="550" y="1290" text-anchor="middle" font-size="11" font-weight="bold" fill="#4527A0">Scenario Comparison</text>
  <text x="550" y="1306" text-anchor="middle" font-size="9.5" fill="#37474F">• Free-flow vs. incident scenario</text>
  <text x="550" y="1320" text-anchor="middle" font-size="9.5" fill="#37474F">• Resource allocation comparison</text>

  <rect x="740" y="1270" width="300" height="62" rx="5" fill="white" stroke="#4527A0" stroke-width="1.2"/>
  <text x="890" y="1290" text-anchor="middle" font-size="11" font-weight="bold" fill="#4527A0">Policy Recommendations</text>
  <text x="890" y="1306" text-anchor="middle" font-size="9.5" fill="#37474F">• Emergency resource layout optimization</text>
  <text x="890" y="1320" text-anchor="middle" font-size="9.5" fill="#37474F">• Evacuation plan formulation</text>

  <rect x="60" y="1346" width="990" height="26" rx="3" fill="#EDE7F6" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="550" y="1364" text-anchor="middle" font-size="10" fill="#4527A0" font-style="italic">Methods: GIS Visualization | Scenario Comparison | Equity Evaluation | Urban Resilience Assessment</text>

  <!-- Tool stack -->
  <rect x="60" y="1405" width="980" height="50" rx="6" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1"/>
  <text x="550" y="1424" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474F">Technical Stack</text>
  <text x="550" y="1442" text-anchor="middle" font-size="9.5" fill="#616161">Python (GeoPandas, NetworkX, SciPy, NumPy) | GIS (Shapely, Fiona) | Solver (PuLP / Gurobi) | Visualization (Matplotlib)</text>

  <!-- Feedback loop -->
  <path d="M1080,710 C1095,710 1095,1043 1080,1043" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-b)"/>
  <text x="1092" y="880" text-anchor="middle" font-size="9" fill="#1565C0" transform="rotate(90, 1092, 880)">Iterative Feedback</text>

  <!-- Caption -->
  <text x="550" y="1500" text-anchor="middle" font-size="9" fill="#9E9E9E">Fig. 1  Technical Roadmap</text>
</svg>